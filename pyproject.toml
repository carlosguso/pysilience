[project]
name = "pysilience"
version = "0.1.0"
description = "Fault tolerance library for Python - Circuit Breaker, Retry, Rate Limiter, Timeout, Bulkhead"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Carlos Gutierrez", email = "carlosguso@protonmail.com" }
]
keywords = [
    "resilience",
    "fault-tolerance",
    "circuit-breaker",
    "retry",
    "rate-limiter",
    "timeout",
    "bulkhead",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

# IMPORTANT: No runtime dependencies - everything uses stdlib only
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=4.0",
    "mypy>=1.8",
    "ruff>=0.8",
]

[project.urls]
Homepage = "https://github.com/carlosguso/pysilience"
Documentation = "https://github.com/carlosguso/pysilience#readme"
Repository = "https://github.com/carlosguso/pysilience"
Issues = "https://github.com/carlosguso/pysilience/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pysilience"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "W",      # pycodestyle warnings
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["pysilience"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["src/pysilience"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
